name: Update Profile Widgets
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: platane/snk@v3
        with:
          github_user_name: Zoooi9918
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3a7ce2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Push Snake to profile-snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-snake
          build_dir: dist
          commit_message: "Update dynamic snake widgets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D Calendar and Push
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.GH_PAT }}
          user: Zoooi9918
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: profile-metrics
          committer_message: "Update 3D Calendar widget"